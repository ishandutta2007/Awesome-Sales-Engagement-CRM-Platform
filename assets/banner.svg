<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="pipeline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>

    <!-- Drop Shadow for Foreground Cards and Texts -->
    <filter id="shadow-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-canvas { fill: url(#bg-grad); }
    .grid-overlay { fill: url(#cyber-grid); }
    
    /* Dynamic Pipeline Animation */
    @keyframes pulseDash {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.2); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    @keyframes flowCard {
      0% { transform: translateX(0px); opacity: 0.25; }
      50% { transform: translateX(10px); opacity: 0.45; }
      100% { transform: translateX(0px); opacity: 0.25; }
    }
    @keyframes orbitPulse {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 7px; opacity: 0.9; }
      100% { r: 4px; opacity: 0.4; }
    }

    .pipeline-wire {
      stroke: url(#pipeline-grad);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 8 12;
      animation: pulseDash 15s linear infinite;
    }

    .dynamic-node-1 { animation: orbitPulse 3s ease-in-out infinite; }
    .dynamic-node-2 { animation: orbitPulse 3s ease-in-out infinite 1.5s; }
    .dynamic-card { animation: flowCard 6s ease-in-out infinite; }

    .glow-dot {
      fill: #a855f7;
      filter: url(#glow-filter);
    }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }

    .pill-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e0e7ff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" class="bg-canvas" />
  <rect width="1200" height="360" class="grid-overlay" />

  <!-- Dynamic Animated Graphic Layer (Background Pipeline Elements) -->
  <g opacity="0.6">
    <!-- Flow Curves -->
    <path d="M -50 180 Q 250 80, 550 200 T 1150 140" fill="none" class="pipeline-wire" />
    <path d="M -50 240 Q 350 320, 750 180 T 1250 260" fill="none" class="pipeline-wire" opacity="0.6" style="animation-duration: 20s; animation-direction: reverse;" />

    <!-- Animated Data Flow / Metric Background Cards -->
    <g class="dynamic-card" transform="translate(850, 40)">
      <rect width="280" height="85" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="32" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="600">PIPELINE VELOCITY</text>
      <text x="20" y="62" font-family="sans-serif" font-size="22" fill="#10b981" font-weight="bold">+48.2% ▲</text>
      <circle cx="240" cy="42" r="5" class="dynamic-node-1 glow-dot" fill="#10b981" />
    </g>

    <g class="dynamic-card" transform="translate(890, 160)" style="animation-delay: 2s;">
      <rect width="240" height="75" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="600">OUTREACH CADENCE</text>
      <text x="20" y="58" font-family="sans-serif" font-size="18" fill="#38bdf8" font-weight="bold">Multi-Channel Active</text>
      <circle cx="210" cy="38" r="4" class="dynamic-node-2 glow-dot" fill="#38bdf8" />
    </g>

    <!-- Node Junctions -->
    <circle cx="320" cy="140" r="4" class="dynamic-node-1" fill="#ec4899" />
    <circle cx="550" cy="200" r="5" class="dynamic-node-2" fill="#8b5cf6" />
    <circle cx="780" cy="175" r="4" class="dynamic-node-1" fill="#3b82f6" />
  </g>

  <!-- Foreground Content with High-Contrast Drop Shadow (Always on top) -->
  <g filter="url(#shadow-filter)" transform="translate(80, 0)">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, 55)">
      <rect width="260" height="30" rx="15" fill="#312e81" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#a855f7" class="dynamic-node-1" />
      <text x="32" y="20" class="pill-badge">ENTERPRISE REVENUE ENGINE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 140)">
      <text class="title-text">
        <tspan fill="#ffffff">Awesome </tspan>
        <tspan fill="url(#primary-glow)">Sales Engagement</tspan>
      </text>
      <text y="50" class="title-text">
        <tspan fill="#ffffff">&amp; CRM Platforms</tspan>
      </text>
    </g>

    <!-- Subtitle Description -->
    <g transform="translate(0, 240)">
      <text class="subtitle-text">
        Curated ecosystem of SaaS leaders, open-source CRMs, and autonomous AI sales cadences.
      </text>
      <text y="26" class="subtitle-text" fill="#64748b">
        Salesforce • HubSpot • Twenty • Odoo • AgentSDR • Multi-Channel Sequences • RevOps
      </text>
    </g>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 305)">
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">⚡ AI Cadences</text>

      <rect x="135" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="149" y="17" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">📊 Deal Pipelines</text>

      <rect x="280" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="294" y="17" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">🔓 100% Open Source</text>
    </g>
  </g>
</svg>
