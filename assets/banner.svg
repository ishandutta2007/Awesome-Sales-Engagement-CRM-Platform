<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="titleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Geometric Grid Pattern -->
    <pattern id="crmGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
      <circle cx="0" cy="0" r="1.5" fill="#64748b" fill-opacity="0.4"/>
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.04); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatCardDelayed {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { r: 4px; opacity: 0.7; }
        50% { r: 6.5px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes radarBeacon {
        0% { r: 5px; opacity: 0.9; stroke-width: 2px; }
        100% { r: 24px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes pipelineSweep {
        0% { opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { opacity: 0.3; }
      }
      @keyframes badgeShimmer {
        0% { stop-color: #6366f1; }
        50% { stop-color: #38bdf8; }
        100% { stop-color: #6366f1; }
      }

      .pulse-bg { transform-origin: 850px 160px; animation: pulseGlow 6s infinite ease-in-out; }
      .float-1 { animation: floatCard 4.8s infinite ease-in-out; }
      .float-2 { animation: floatCardDelayed 5.5s infinite ease-in-out; }
      .flow-line { stroke-dasharray: 8, 6; animation: flowDash 4s infinite linear; }
      .flow-line-fast { stroke-dasharray: 6, 4; animation: flowDash 2.5s infinite linear; }
      .node-pulse { animation: pulseNode 3s infinite ease-in-out; }
      .beacon-ring { animation: radarBeacon 2.6s infinite cubic-bezier(0.1, 0.8, 0.3, 1); }
      .pipeline-node { animation: pipelineSweep 3s infinite ease-in-out; }

      .font-display {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1100" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1100" height="320" rx="16" fill="url(#crmGrid)"/>

  <!-- Ambient Ambient Glows -->
  <circle cx="900" cy="160" r="140" fill="url(#glowGrad)" class="pulse-bg"/>
  <circle cx="150" cy="60" r="100" fill="#6366f1" fill-opacity="0.1" filter="url(#glow)"/>

  <!-- Dynamic Animated Graph & Pipeline Layer (Right & Center Background) -->
  <g opacity="0.85">
    <!-- Pipeline Connection Circuit Lines -->
    <path d="M 620 220 L 710 220 L 760 160 L 840 160 L 890 100 L 980 100" 
          fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M 620 220 L 710 220 L 760 160 L 840 160 L 890 100 L 980 100" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-line"/>

    <!-- Outreach Secondary Pipeline -->
    <path d="M 680 110 L 740 110 L 780 160 L 860 160 L 900 230 L 970 230" 
          fill="none" stroke="#334155" stroke-width="1.5"/>
    <path d="M 680 110 L 740 110 L 780 160 L 860 160 L 900 230 L 970 230" 
          fill="none" stroke="#818cf8" stroke-width="2" class="flow-line-fast"/>
  </g>

  <!-- Interactive Dynamic Floating Cards (Sales Intelligence & Cadence) -->
  
  <!-- Floating Metric Card 1: Revenue & Pipeline Growth (Top Right) -->
  <g class="float-1" transform="translate(760, 42)" filter="url(#cardShadow)">
    <rect width="280" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <!-- Header -->
    <circle cx="24" cy="26" r="6" fill="#10b981"/>
    <circle cx="24" cy="26" r="12" fill="none" stroke="#10b981" class="beacon-ring"/>
    <text x="38" y="30" fill="#94a3b8" font-size="11" font-weight="600" class="font-display" letter-spacing="0.5">SALES VELOCITY &amp; ARR</text>
    <text x="214" y="30" fill="#10b981" font-size="12" font-weight="700" class="font-display">+342% ↗</text>
    
    <!-- Mini Area Chart -->
    <path d="M 20 85 L 60 76 L 105 80 L 150 62 L 195 65 L 240 45 L 260 42 L 260 96 L 20 96 Z" fill="url(#chartGrad)"/>
    <path d="M 20 85 L 60 76 L 105 80 L 150 62 L 195 65 L 240 45 L 260 42" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Pulse nodes on graph -->
    <circle cx="150" cy="62" r="3.5" fill="#38bdf8"/>
    <circle cx="260" cy="42" r="4.5" fill="#10b981" class="node-pulse"/>
  </g>

  <!-- Floating Metric Card 2: Outreach Cadence & Agent SDR (Bottom Right) -->
  <g class="float-2" transform="translate(680, 180)" filter="url(#cardShadow)">
    <rect width="360" height="105" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Stage Header -->
    <circle cx="24" cy="24" r="5" fill="#6366f1"/>
    <text x="38" y="28" fill="#e2e8f0" font-size="12" font-weight="700" class="font-display">Agentic SDR Cadence</text>
    <rect x="265" y="16" width="78" height="20" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="304" y="30" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle" class="font-display">ACTIVE • 99.4%</text>

    <!-- Outreach Funnel Stage Pills -->
    <g transform="translate(20, 48)">
      <!-- Stage 1 -->
      <rect width="66" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="33" y="18" fill="#94a3b8" font-size="9" text-anchor="middle" class="font-display">PROSPECTS</text>
      <text x="33" y="32" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle" class="font-display">12,480</text>
      
      <!-- Stage Arrow -->
      <path d="M 72 19 L 78 19" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Stage 2 -->
      <g transform="translate(85, 0)">
        <rect width="66" height="38" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
        <text x="33" y="18" fill="#38bdf8" font-size="9" text-anchor="middle" class="font-display">ENGAGED</text>
        <text x="33" y="32" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle" class="font-display">6,840</text>
      </g>

      <!-- Stage Arrow -->
      <path d="M 157 19 L 163 19" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Stage 3 -->
      <g transform="translate(170, 0)">
        <rect width="66" height="38" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
        <text x="33" y="18" fill="#818cf8" font-size="9" text-anchor="middle" class="font-display">REPLIED</text>
        <text x="33" y="32" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle" class="font-display">2,190</text>
      </g>

      <!-- Stage Arrow -->
      <path d="M 242 19 L 248 19" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Stage 4 -->
      <g transform="translate(255, 0)">
        <rect width="66" height="38" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
        <text x="33" y="18" fill="#34d399" font-size="9" text-anchor="middle" class="font-display">WON DEALS</text>
        <text x="33" y="32" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle" class="font-display">640</text>
      </g>
    </g>
  </g>

  <!-- Distinct Dark Gradient Mask / Backdrop for Guaranteed Text Foreground Readability -->
  <!-- Ensures animated elements never obscure the typography -->
  <rect x="0" y="0" width="640" height="320" rx="16" fill="url(#bgGrad)" opacity="0.94"/>
  
  <!-- Soft Separation Glow -->
  <line x1="640" y1="20" x2="640" y2="300" stroke="#334155" stroke-width="1" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Left Side: Solid FOREGROUND Title, Subtitle, and Feature Badges -->
  <g transform="translate(56, 0)">
    
    <!-- Category Pill Badge -->
    <g transform="translate(0, 42)">
      <rect width="265" height="28" rx="14" fill="#1e293b" stroke="#4f46e5" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#38bdf8"/>
      <text x="28" y="18.5" fill="#c7d2fe" font-size="11" font-weight="700" class="font-display" letter-spacing="0.8">
        ENTERPRISE REVENUE STACK
      </text>
      <circle cx="248" cy="14" r="3" fill="#10b981" class="node-pulse"/>
    </g>

    <!-- Main Title (Strict Foreground, Unobscured) -->
    <g transform="translate(0, 118)" filter="url(#titleShadow)">
      <text x="0" y="0" fill="url(#textGrad)" font-size="34" font-weight="900" class="font-display" letter-spacing="-0.5">
        Sales Engagement
      </text>
      <text x="0" y="44" fill="#f8fafc" font-size="34" font-weight="900" class="font-display" letter-spacing="-0.5">
        &amp; CRM Platform
      </text>
      <text x="305" y="44" fill="#38bdf8" font-size="34" font-weight="900" class="font-display">
        .
      </text>
    </g>

    <!-- Subtitle (Clear, readable, high contrast) -->
    <g transform="translate(0, 202)">
      <text x="0" y="0" fill="#94a3b8" font-size="14.5" font-weight="500" class="font-display">
        Curated Index of Revenue Intelligence, Sales Cadences,
      </text>
      <text x="0" y="24" fill="#cbd5e1" font-size="14.5" font-weight="600" class="font-display">
        AI SDR Agents &amp; Modern Open-Source CRM Architectures
      </text>
    </g>

    <!-- Key Functional Tags / Badges -->
    <g transform="translate(0, 258)">
      <!-- Badge 1: Sales Cadences -->
      <g>
        <rect width="112" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="56" y="17" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" class="font-display">⚡ Cadences</text>
      </g>
      <!-- Badge 2: Open Source CRM -->
      <g transform="translate(120, 0)">
        <rect width="124" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="62" y="17" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" class="font-display">🔓 Open CRM</text>
      </g>
      <!-- Badge 3: AI SDR Agents -->
      <g transform="translate(252, 0)">
        <rect width="122" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="61" y="17" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" class="font-display">🤖 AI SDRs</text>
      </g>
      <!-- Badge 4: RevOps -->
      <g transform="translate(382, 0)">
        <rect width="102" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="51" y="17" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle" class="font-display">📈 RevOps</text>
      </g>
    </g>

  </g>

  <!-- Sleek Accent Bottom Border Line -->
  <rect x="0" y="316" width="1100" height="4" rx="2" fill="url(#primaryGrad)"/>
</svg>
